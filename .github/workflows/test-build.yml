name: Test Build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

# 同一分支/PR 上新的提交到来时,取消还在跑的旧 run。单条 run 要占十几分钟
# (其中九成是 Nuitka 编译),连续推两次会让两条 run 并行烧机时,而旧那条的
# 结果已经没人看了。发版用的 build.yml 【不】开这个开关(见该文件注释)。
concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

# 两个 job 都只读仓库:没有 permissions: 块时 GITHUB_TOKEN 按仓库默认档签发,
# 而这里没有任何一步需要写。
permissions:
  contents: read

jobs:
  # C7 的「测试失败则构建失败」保障由 build 的 needs: test 承担:测试挂了
  # build 根本不会启动。拆成两个 job 是为了快反馈 —— 测试本身只要 1 分钟
  # 量级,不该等打包跑完十几分钟才知道挂没挂。
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        # 缓存 pip 下载与本地构建的 wheel(含 GDAL 的 sdist 编译产物),
        # 拆 job 后依赖要装两遍,靠它把第二遍摊薄。
        cache: 'pip'

    - name: Install GDAL
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev patchelf
        export GDAL_VERSION=$(gdal-config --version)
        echo "GDAL_VERSION=$GDAL_VERSION" >> $GITHUB_ENV

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Python 3.12 的托管环境不再自带 setuptools，而 GDAL 走
        # --no-build-isolation 编译时需要它提供 setuptools.build_meta 后端。
        pip install setuptools wheel
        # GDAL sdist 编译时必须能 import numpy，否则编不出 _gdal_array
        # （gdal_array/numeric 模块缺失，所有用 osgeo.gdal_array 的测试会炸）。
        # 先装 numpy，再关闭 build isolation 编译 GDAL。
        pip install numpy==1.26.4
        # 跟随 apt 实际装上的 libgdal,别硬编码(见 requirements.txt 顶部注释)。
        # $GDAL_VERSION 由上一步 gdal-config --version 写进 $GITHUB_ENV;
        # 硬编码的话,GitHub 把 ubuntu-latest 从 noble(3.8.4)翻到下一版时会静默编错。
        pip install --no-build-isolation "GDAL==$GDAL_VERSION"
        pip install -r requirements.txt

    # 测试均为离线单元测试（monkeypatch 隔离 DB/网络/显示），
    # ubuntu-latest 无显示环境可直接运行，无需排除。
    #
    # --cov-fail-under=78 是**棘轮地板**,不是覆盖率目标。取值口径照搬 GeoL
    # (`CLAUDE.md:37-42`,见 docs/notes/external-projects-takeaways.md §8.1):
    # 地板永远设在【当前实测值下方几个点】,只用来挡回归 —— 一次性冲一个漂亮的
    # 高数字,结果要么是逼着人写不防任何 bug 的凑数测试,要么是地板高到没人敢碰
    # 于是被整条注释掉。
    #
    # 78 = 2026-08-12 实测 82.88%(2550 passed,`--cov=src`,13974 语句缺 2393)
    # 下压 5 点。棘轮接进来那天实测是 75%、地板 70;补完九个新服务的用例之后
    # 涨到 82.88%,于是地板跟着抬到 78 —— 这就是「涨上去就把地板调高锁死」。
    # 只准往上调,不准往下调;下调等于把已经守住的东西又还回去。
    #
    # ⚠️ 只测 `src`,**不要**加 `--cov=app.py`。coverage 拿到 `app.py` 这个
    # source 会去 import 它,而 `app.py` 在模块级就调用 `create_app()` ——
    # 于是在 pytest **解析命令行的阶段**(任何 fixture 之前)就:抢单实例锁、
    # 用真实 Config 建库、在工作树里创建 data/ logs/ cache/ downloads/、
    # 跑一遍启动清扫。本机实测直接 SystemExit(1) 收场(锁被占),CI 上则是
    # 在干净 clone 里静默产出这些目录,把 tests/test_no_repo_pollution.py 的
    # 会话基线污染成「本来就存在」,那条防线从此永远跳过。
    # app.py 只有 4 KB 且全是启动装配,测它的收益远小于这个代价。
    #
    # 也不要 `--cov=.`:那会把 tests/ 自己和 nuitka_build.py 算进分母,
    # 数字随测试代码量涨落,棘轮就失去意义。
    #
    # `python -m pytest tests/` 这个**字面子串**被 tests/test_fix_ci_workflows.py
    # 钉着(它还断言这一步排在打包步骤之前),所以覆盖率参数只能加在 `tests/`
    # **后面**,不能改写成 `-m pytest --cov=src tests/`。
    #
    # ⚠️ 这段注释里不能出现打包命令的**字面写法**:
    # tests/test_fix_build_scripts.py::test_every_job_that_builds_runs_the_gdal_gate_first
    # 是按「job 的源码文本里含不含那个字面子串」来判定一个 job 是不是打包 job 的,
    # 注释同样算数 —— 写进去就会把这个只跑测试的 job 误判成打包 job,
    # 然后因为它没跑 scripts/check_gdal.py 而报红。
    #
    # `--junitxml` + 后面那段校验不是为了报告好看,是为了让「这一步绿」真的等于
    # 「套件跑完了」。pytest 被**中途杀掉且退出码为 0** 时,GitHub 只看退出码,
    # 这一步照样绿:v0.3.3 首次发版就撞上了 —— 一条测试用例遗留的看门狗线程在
    # 77% 处调了 os._exit(0),日志停在半行、没有汇总,而同一个 commit 在
    # build.yml 里跑完全程并报出一条真实失败(根因已在
    # tests/test_process_watchdog.py 修掉,这里守的是「下一次」)。
    # junit 报告只在会话正常收尾时才落盘,所以「文件在不在」正好是那个判据。
    - name: Run test suite
      run: |
        rm -f junit.xml
        python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=78 -q --junitxml=junit.xml
        python - <<'PY'
        import os
        import sys
        import xml.etree.ElementTree as ET

        if not os.path.exists('junit.xml'):
            sys.exit('FAILED: pytest 退出码为 0 却没写出 junit.xml —— '
                     '套件没有跑完,进程是被中途杀掉的。')
        root = ET.parse('junit.xml').getroot()
        suites = [root] if root.tag == 'testsuite' else list(root)
        total = sum(int(s.get('tests', 0)) for s in suites)
        bad = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
        print(f'junit: tests={total} failures+errors={bad}')
        if bad:
            sys.exit(f'FAILED: junit 报告里有 {bad} 条失败/错误')
        # 用例数地板,与覆盖率地板同一个棘轮口径:2026-08-12 实测 2613 条,
        # 取 2500。整段套件被静默截掉一大块时这里兜底。只准往上调。
        if total < 2500:
            sys.exit(f'FAILED: 只跑了 {total} 条用例,低于地板 2500')
        PY

  build:
    needs: test
    runs-on: ubuntu-latest

    env:
      # 见 build.yml 中同名变量的注释:Nuitka 的 ccache/clcache/downloads
      # 全部落在这个根目录下,靠 actions/cache 跨 run 保住 C 编译结果。
      NUITKA_CACHE_DIR: ~/.nuitka-cache
      CCACHE_MAXSIZE: 1G

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install GDAL
      run: |
        sudo apt-get update
        # ccache: Linux 上 Nuitka 不会自动下载它(只打印 "You are not using
        # ccache" 的警告后裸编译),必须由包管理器装,否则下面的缓存全是空转。
        sudo apt-get install -y gdal-bin libgdal-dev patchelf ccache
        export GDAL_VERSION=$(gdal-config --version)
        echo "GDAL_VERSION=$GDAL_VERSION" >> $GITHUB_ENV

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel
        pip install numpy==1.26.4
        # 跟随 apt 实际装上的 libgdal,别硬编码(见 requirements.txt 顶部注释)。
        # $GDAL_VERSION 由上一步 gdal-config --version 写进 $GITHUB_ENV;
        # 硬编码的话,GitHub 把 ubuntu-latest 从 noble(3.8.4)翻到下一版时会静默编错。
        pip install --no-build-isolation "GDAL==$GDAL_VERSION"
        # Nuitka 由 requirements.txt 按钉的版本装(不再 `pip install nuitka` 拉最新):
        # nuitka_build.py 依赖 nuitka.freezer 的私有 API,版本一飘就是构建期炸。
        pip install -r requirements.txt
        echo "NUITKA_VERSION=$(python -c "import importlib.metadata as m; print(m.version('nuitka'))")" >> $GITHUB_ENV

    # GDAL 闸门:与 build.yml / build.sh / build.bat 共用 scripts/check_gdal.py。
    # 判据(requirements.txt 的版本范围 + _gdal_array 在位)只此一份实现。缺
    # _gdal_array 的绑定打出来的 exe 能构建、能启动、冒烟请求 `/` 也 200,只有
    # DEM/地形/等高线作业会炸 —— 必须在装完依赖之后、Nuitka 之前拦住。
    - name: Verify GDAL binding
      run: python scripts/check_gdal.py

    # 跨 run 复用 C 编译结果 —— 这一步是整条流水线提速的关键,详见 build.yml
    # (key 里带 Nuitka 版本的理由也在那里)。
    - name: Cache Nuitka C compilation
      uses: actions/cache@v4
      with:
        path: ~/.nuitka-cache
        key: nuitka-${{ runner.os }}-n${{ env.NUITKA_VERSION }}-${{ hashFiles('requirements.txt', 'nuitka_build.py') }}-${{ github.sha }}
        restore-keys: |
          nuitka-${{ runner.os }}-n${{ env.NUITKA_VERSION }}-${{ hashFiles('requirements.txt', 'nuitka_build.py') }}-
          nuitka-${{ runner.os }}-n${{ env.NUITKA_VERSION }}-

    - name: Test Nuitka build
      run: |
        python nuitka_build.py
        ls -lh dist/

    - name: Report compilation cache size
      if: always()
      run: du -sh ~/.nuitka-cache 2>/dev/null || echo "no cache dir"

    - name: Verify executable exists
      run: |
        test -f dist/terraforge/terraforge
        echo "Build successful!"

    # 冒烟测试:真正启动 exe 并请求首页 + 瓦片端口健康端点(构建成功 ≠ 能运行;
    # 5001 起不来是静默降级,不单独探就永远报绿——见 build.yml 同名步骤)。
    - name: Smoke test executable
      run: |
        cd dist/terraforge
        ./terraforge > smoke.log 2>&1 &
        SMOKE_PID=$!
        main_code=000
        tile_code=000
        for i in $(seq 1 30); do
          main_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || true)
          tile_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5001/tile-health || true)
          [ "$main_code" = "200" ] && [ "$tile_code" = "204" ] && break
          sleep 2
        done
        kill $SMOKE_PID 2>/dev/null || true
        tail -30 smoke.log
        if [ "$main_code" != "200" ] || [ "$tile_code" != "204" ]; then
          echo "Smoke test FAILED (main HTTP $main_code, tile health HTTP $tile_code)"
          exit 1
        fi
        echo "Smoke test OK (main HTTP 200, tile health HTTP 204)"
