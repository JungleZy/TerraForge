name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: map-downloader-linux
            asset_name: map-downloader-linux.tar.gz
          - os: windows-latest
            artifact_name: map-downloader-windows
            asset_name: map-downloader-windows.zip
          - os: macos-latest
            artifact_name: map-downloader-macos
            asset_name: map-downloader-macos.tar.gz

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # On Windows we install GDAL via conda-forge; using a login shell ensures
        # the conda environment activated by setup-miniconda is on PATH for every
        # subsequent step. bash -l works on all three runners.
        shell: bash -l {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Set up Miniconda (Windows)
      if: runner.os == 'Windows'
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        python-version: '3.9'
        activate-environment: build
        channels: conda-forge
        channel-priority: strict

    - name: Install GDAL (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
        echo "GDAL_VERSION=$(gdal-config --version)" >> $GITHUB_ENV

    - name: Install GDAL (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gdal
        echo "GDAL_VERSION=$(gdal-config --version)" >> $GITHUB_ENV

    - name: Install GDAL (Windows, conda-forge)
      if: runner.os == 'Windows'
      run: |
        # choco no longer ships a 'gdal' package; conda-forge is the only
        # reliable Windows GDAL on hosted runners as of 2026.
        conda install -y -c conda-forge gdal=3.8 numpy
        GDAL_VERSION=$(python -c "from osgeo import gdal; print(gdal.__version__)")
        echo "GDAL_VERSION=$GDAL_VERSION" >> $GITHUB_ENV
        # conda's gdal sets GDAL_DATA via activate scripts; surface it here so
        # build.spec can pick it up in a fresh sub-shell.
        GDAL_DATA=$(python -c "from osgeo import gdal; print(gdal.GetConfigOption('GDAL_DATA') or '')")
        echo "GDAL_DATA=$GDAL_DATA" >> $GITHUB_ENV

    - name: Install Python dependencies (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Install Python dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # GDAL already comes from conda; pip-installing it again would try to
        # build from sdist and fail. Strip the GDAL pin and install the rest.
        grep -viE '^[[:space:]]*gdal([[:space:]=<>!~]|$)' requirements.txt > /tmp/req.txt
        pip install -r /tmp/req.txt

    - name: Build with PyInstaller
      run: pyinstaller build.spec

    - name: Package application (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ${{ matrix.asset_name }} map-downloader/

    - name: Package application (Windows)
      if: runner.os == 'Windows'
      run: |
        cd dist
        # 7z is preinstalled on windows-latest and works from bash without
        # PowerShell quoting headaches.
        7z a -tzip ${{ matrix.asset_name }} map-downloader/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.asset_name }}

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
