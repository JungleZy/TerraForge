name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: '把三平台产物作为 artifact 上传（三个包约 450MB，免费额度只有 500MB，只在确实要下载调试产物时才开）'
        type: boolean
        default: false

# 同一 ref 串行化，但【不】取消进行中的构建:发版构建被中途取消会留下
# 只挂了部分平台产物的 Release。这里只防止重复 dispatch 同时打架。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # 【不】开 fail-fast:下面的 Create Release 跑在【每个 matrix job 内部】,
      # 一个平台在打包阶段失败会连带取消另外两个,于是已经发布出去的 Release
      # 停在只挂了一两个平台产物的状态 —— 与文件顶部 cancel-in-progress: false
      # 想防的是同一件事,而默认的 fail-fast: true 正好把它抵消掉。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: terraforge-linux
            asset_name: terraforge-linux.tar.gz
          - os: windows-latest
            artifact_name: terraforge-windows
            asset_name: terraforge-windows.zip
          - os: macos-latest
            artifact_name: terraforge-macos
            asset_name: terraforge-macos.tar.gz

    # 只给这个 job 它真正需要的写权限。不声明 permissions: 时 GITHUB_TOKEN 按
    # 仓库默认档(常见是 write-all)签发,而下面的 Create Release 是第三方 action,
    # 拿到的就是那把全权令牌。发版只需要往 Releases 写。
    permissions:
      contents: write

    runs-on: ${{ matrix.os }}

    env:
      # Nuitka 把所有缓存都放在这一个根目录下(见 nuitka/utils/AppDirs.py 的
      # _getCacheDir:NUITKA_CACHE_DIR 是唯一开关,且会走 expanduser,所以 '~'
      # 写法在三个平台都成立):
      #   ccache/    Linux+macOS 的 C 编译结果缓存
      #   clcache/   Windows(MSVC)的 C 编译结果缓存,Nuitka 自带的内置实现
      #   downloads/ Nuitka 自动下载的 ccache(macOS)与 depends22_x64.zip(Windows)
      # 不设它的话缓存落在各平台默认 user cache 目录,runner 一销毁就没了 ——
      # 这正是此前每次构建 690~705 个 C 文件 100% cache miss 的原因。
      NUITKA_CACHE_DIR: ~/.nuitka-cache
      # ccache 默认上限 5G。三平台各存一份,单仓库 Actions cache 配额只有 10G,
      # 这里压到 1G(实测一次完整构建的对象文件量远小于此)。
      CCACHE_MAXSIZE: 1G

    defaults:
      run:
        # Windows and macOS both install GDAL via conda-forge (see GDAL step
        # for the why). A login shell ensures the conda env activated by
        # setup-miniconda is on PATH for every subsequent step. bash -l works
        # on all three runners (Linux is unaffected — it uses system apt GDAL).
        #
        # -eo pipefail 必须显式写回:自定义 shell 会整串替换掉 GitHub 默认的
        # `bash --noprofile --norc -eo pipefail {0}`,于是每个多命令 step 只由
        # 最后一条命令的退出码定成败。「Install GDAL (Windows/macOS)」正是以一句
        # 恒成功的 `echo >> $GITHUB_ENV` 收尾 —— conda 装失败会报绿,几步之后
        # 变成一个风马牛不相及的 ImportError。
        shell: bash -leo pipefail {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python (Linux)
      if: runner.os == 'Linux'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Miniconda (Windows/macOS)
      if: runner.os != 'Linux'
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        python-version: '3.12'
        activate-environment: build
        channels: conda-forge
        channel-priority: strict

    # tag ↔ Config.APP_VERSION 一致性闸门(§8.2「TerraForge 当前应做的」第一项,
    # 见 docs/notes/external-projects-takeaways.md)。
    #
    # 防的是发版当天最丢人也最难撤的那一类事故:推了 `v0.3.3`,但
    # `src/core/config.py` 里的 APP_VERSION 还停在 `0.3.2` —— 构建全绿、Release
    # 挂出去了,用户下载运行,界面标题、`/api/config` 与日志横幅全都自称 0.3.2。
    # Release 页面与程序自报版本对不上之后,任何 issue 都无法判断复现的是哪个包。
    # Release 一旦 published 就已经被镜像/爬取,删掉重发也收不回来。
    #
    # 排在最前面(装 GDAL 与依赖之前):它只需要 Python 标准库,几秒钟就能出结果,
    # 没有理由让它排在四十分钟的编译后面才红。
    # 非 tag 触发(workflow_dispatch 预热缓存)时跳过 —— 那时没有版本可比。
    #
    # 用 AST 读字面量而不是 `import src.core.config`:后者会把 Flask、GDAL、
    # SQLite 整条依赖链拉起来,而这一步刻意排在装依赖之前。
    - name: Verify tag matches Config.APP_VERSION
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        APP_VERSION=$(python - <<'PY'
        import ast
        tree = ast.parse(open('src/core/config.py', encoding='utf-8').read())
        for node in ast.walk(tree):
            if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant):
                for target in node.targets:
                    if isinstance(target, ast.Name) and target.id == 'APP_VERSION':
                        print(node.value.value)
                        raise SystemExit(0)
        raise SystemExit('APP_VERSION not found in src/core/config.py')
        PY
        )
        echo "tag=$TAG  Config.APP_VERSION=$APP_VERSION"
        # tag 一律带 `v` 前缀(见文件顶部的 on.push.tags: 'v*'),APP_VERSION 不带。
        if [ "$TAG" != "v$APP_VERSION" ]; then
          echo "FAILED: tag $TAG 与 Config.APP_VERSION $APP_VERSION 不一致"
          echo "改 src/core/config.py 的 APP_VERSION 后重打 tag,不要只改 tag。"
          exit 1
        fi
        echo "Version check OK ($TAG == v$APP_VERSION)"

    - name: Install GDAL (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        # ccache: Linux 上 Nuitka 不会像 macOS 那样自动下载它(只会打印
        # "You are not using ccache" 的警告继续裸编译),必须由包管理器装。
        sudo apt-get install -y gdal-bin libgdal-dev patchelf ccache
        echo "GDAL_VERSION=$(gdal-config --version)" >> $GITHUB_ENV

    - name: Install GDAL (Windows/macOS, conda-forge)
      if: runner.os != 'Linux'
      run: |
        # Why conda-forge instead of brew/choco:
        #  - Windows: choco gdal package is dead.
        #  - macOS: macos-latest is Apple Silicon (arm64). brew ships arm64-only
        #    gdal, but pip's GDAL sdist tries to build a universal2 wheel and
        #    fails to link against the arm64-only libgdal. conda-forge ships a
        #    matching arm64 prebuilt + Python binding, no pip compile needed.
        # gdal=3.8 是【钉死的构建输入】,不是「哪个 GDAL 可接受」这条规则的第二处
        # 实现:conda 这边不受 Linux 那条「绑定要对上系统 libgdal」的约束,钉住才能
        # 让同一个 tag 两次构建打出同样的 DLL。它与 requirements.txt 的
        # `GDAL>=3.8,<4` 谁说了算,由下面的「Verify GDAL binding」裁决 —— 那一步
        # 排在本步之后,读 requirements.txt 的范围、量这里真装上的版本,所以这个钉
        # 值一旦漂出范围就是 CI 红。规则本身仍然只有那一个脚本一处实现;
        # 在 YAML 里把范围反过来喂给 conda 则会让发版产物随 conda-forge 当日最新的
        # 3.x 漂移,与「同一 commit 打出同样的包」冲突。
        conda install -y -c conda-forge gdal=3.8 numpy
        GDAL_VERSION=$(python -c "from osgeo import gdal; print(gdal.__version__)")
        echo "GDAL_VERSION=$GDAL_VERSION" >> $GITHUB_ENV
        # conda's gdal sets GDAL_DATA via activate scripts; surface it here so
        # nuitka_build.py can pick it up in a fresh sub-shell.
        GDAL_DATA=$(python -c "from osgeo import gdal; print(gdal.GetConfigOption('GDAL_DATA') or '')")
        echo "GDAL_DATA=$GDAL_DATA" >> $GITHUB_ENV

    - name: Install Python dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        python -m pip install --upgrade pip
        # Python 3.12 的托管环境不再自带 setuptools，而 GDAL 走
        # --no-build-isolation 编译时需要它提供 setuptools.build_meta 后端。
        pip install setuptools wheel
        # GDAL sdist 编译时必须能 import numpy，否则编不出 _gdal_array：
        # 先装 numpy，再关闭 build isolation 编译 GDAL。
        pip install numpy==1.26.4
        # 跟随 apt 实际装上的 libgdal,别硬编码(见 requirements.txt 顶部注释)。
        # $GDAL_VERSION 由上面的 gdal-config --version 写进 $GITHUB_ENV。
        pip install --no-build-isolation "GDAL==$GDAL_VERSION"
        # Nuitka 从 requirements.txt 里【按钉的版本】装,不再 `pip install nuitka`
        # 拉最新:nuitka_build.py 调的是 nuitka.freezer 的私有 API,上游一改签名
        # 就是 tag 推上去之后才炸的 Windows 构建。
        pip install -r requirements.txt
        echo "NUITKA_VERSION=$(python -c "import importlib.metadata as m; print(m.version('nuitka'))")" >> $GITHUB_ENV

    - name: Install Python dependencies (Windows/macOS)
      if: runner.os != 'Linux'
      run: |
        python -m pip install --upgrade pip
        # GDAL already comes from conda; pip-installing it again would try to
        # build from sdist and fail. Strip the GDAL pin and install the rest
        # (Nuitka included — it is pinned in requirements.txt, see the Linux step).
        grep -viE '^[[:space:]]*gdal([[:space:]=<>!~]|$)' requirements.txt > /tmp/req.txt
        pip install -r /tmp/req.txt
        echo "NUITKA_VERSION=$(python -c "import importlib.metadata as m; print(m.version('nuitka'))")" >> $GITHUB_ENV

    # GDAL 闸门:与 build.sh / build.bat 共用 scripts/check_gdal.py,判据只此一份
    # (requirements.txt 声明的版本范围 + _gdal_array 在位)。此前闸门只挂在那两个
    # 本地脚本上,CI 的打包步骤从旁边绕了过去 —— 而带 build isolation 装出来的绑定
    # 缺 _gdal_array 时,exe 照样构建成功、照样启动、冒烟请求 `/` 照样 200,只有
    # 用户机器上的 DEM/地形/等高线作业会炸。必须排在装完依赖之后、打包之前。
    - name: Verify GDAL binding
      run: python scripts/check_gdal.py

    # 跨 run 复用 C 编译结果。Nuitka 90% 的耗时是把 690+ 个生成的 C 文件
    # 编译成对象文件,而其中绝大多数(numpy/matplotlib/PIL/aiohttp/flask 等
    # 第三方库)在两次构建之间逐字节不变 —— 缓存命中即可跳过。
    # key 带 sha 保证每个 commit 都写回一份新缓存(cache 条目不可变,同 key
    # 只写一次);restore-keys 按前缀回退到最近一次可用的缓存。
    #
    # ⚠ 缓存有 ref 隔离:一个 run 只能读到【自己这个 ref】和【默认分支】上写的
    # 缓存。本 workflow 平时只在 tag 上跑,而 tag 写的缓存对下一个 tag 不可见 ——
    # 光靠发版自己是永远热不起来的,每次发版都会是全 miss 的 41 分钟。
    # 所以 Windows/macOS 的缓存要靠在 master 上手动 workflow_dispatch 跑一次
    # 本 workflow 来铺(Linux 的由 test-build.yml 每次 push master 顺带铺好)。
    # 铺一次能用很久:第三方库那 600 多个 C 文件不随业务代码变,后续 tag 构建
    # 直接命中;缓存 7 天不被读取才会被 GitHub 回收,而每次发版都会读它。
    #
    # key 里带 Nuitka 版本:ccache 的对象文件是【Nuitka 生成的 C 源】编出来的,
    # 换一个 Nuitka 版本这些源就变了。光靠 hashFiles(requirements.txt) 不够 ——
    # 最宽的那条 restore-key 会绕过 hash,把旧版本留下的缓存拉回来。
    - name: Cache Nuitka C compilation
      uses: actions/cache@v4
      with:
        path: ~/.nuitka-cache
        key: nuitka-${{ runner.os }}-n${{ env.NUITKA_VERSION }}-${{ hashFiles('requirements.txt', 'nuitka_build.py') }}-${{ github.sha }}
        restore-keys: |
          nuitka-${{ runner.os }}-n${{ env.NUITKA_VERSION }}-${{ hashFiles('requirements.txt', 'nuitka_build.py') }}-
          nuitka-${{ runner.os }}-n${{ env.NUITKA_VERSION }}-

    # C7: 先跑完整测试套件再打包——测试失败则构建失败。
    # 三个平台均已装好 GDAL（Linux=apt、Windows/macOS=conda-forge），
    # 测试为离线单元测试，无显示/无网络环境下全部可运行。
    #
    # --cov-fail-under=78 与 test-build.yml 那一步是同一个**棘轮地板**,完整
    # 理由(为什么是「实测值下压几点」、为什么不能加 `--cov=app.py`、为什么参数
    # 只能加在 `tests/` 后面)写在 test-build.yml 的同名步骤上,那里是它先落地
    # 的地方。两处必须同值同参:发版这条流水线松一点,等于所有回归都能靠推 tag
    # 绕过去。
    - name: Run test suite
      run: python -m pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=78 -q

    - name: Build with Nuitka
      run: python nuitka_build.py

    # 缓存效果自检:Nuitka 会打印 "Compiled N C files using ccache/clcache"
    # 与命中/未命中计数,这里把缓存体积一并打出来,便于盯 10G 配额。
    - name: Report compilation cache size
      if: always()
      run: du -sh ~/.nuitka-cache 2>/dev/null || echo "no cache dir"

    # 冒烟测试:真正启动 exe 并请求首页 + 瓦片端口健康端点。构建成功 ≠ 能运行
    # ——GDAL DLL 搜索路径、conda SWIG shim 的 pkg_resources 路径、
    # multiprocessing spawn 等运行时问题只有跑了才暴露(v0.1.1 三次踩坑)。
    # 5001 单独要一条判据:瓦片端口起不来是**静默降级**(tile_server 绑定失败
    # 返回 None,主服务照常 200),只探 5000 的话这类回归永远报绿,用户拿到的
    # 是一个瓦片全走同源、首屏仍被浏览器连接池堵死的包。
    - name: Smoke test executable
      run: |
        cd dist/terraforge
        EXE=./terraforge
        [ "${{ runner.os }}" = "Windows" ] && EXE=./terraforge.exe
        "$EXE" > smoke.log 2>&1 &
        SMOKE_PID=$!
        main_code=000
        tile_code=000
        for i in $(seq 1 30); do
          main_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || true)
          tile_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5001/tile-health || true)
          [ "$main_code" = "200" ] && [ "$tile_code" = "204" ] && break
          sleep 2
        done
        kill $SMOKE_PID 2>/dev/null || true
        tail -30 smoke.log
        if [ "$main_code" != "200" ] || [ "$tile_code" != "204" ]; then
          echo "Smoke test FAILED (main HTTP $main_code, tile health HTTP $tile_code)"
          exit 1
        fi
        echo "Smoke test OK (main HTTP 200, tile health HTTP 204)"

    # M19: 冒烟测试那一次启动会在 dist/terraforge/ 里生成运行期数据 ——
    # frozen 模式下 Config.BASE_DIR = exe 所在目录。其中 data/map_downloader.db
    # 不是空壳:init_database() 播种 './downloads' 后【在同一次调用里】把它归一
    # 成当时机器上的绝对路径(如 /home/runner/work/... 或 D:\a\map-download\...),
    # 而用户端首启的归一化分支只处理相对值、不会再动它。打包进 Release 的话,
    # 用户解压运行后表单会被预填成 CI 机器的路径:有可写盘时几十 GB 瓦片写进
    # 一个想不到的位置(且不在 exe 旁边,与「便携」设计相悖),没有则任务必败。
    - name: Strip smoke-test runtime data before packaging
      run: |
        rm -rf dist/terraforge/data dist/terraforge/downloads dist/terraforge/cache
        rm -f dist/terraforge/smoke.log
        # logs/terraforge.log:frozen 单进程的 show_startup_output 为真,
        # configure_logging(log_to_file=True) 会建出它 —— 光是那条
        # 「SECRET_KEY 未配置」的 warning 就足以落盘,内容里带 CI runner 路径。
        #
        # 每任务日志(阶段 3 新增)不需要在这里加第二条:`task_logging.task_log_dir()`
        # = `logging_setup.log_dir() / TASK_LOG_DIR_NAME` = `<BASE_DIR>/logs/tasks`,
        # 整个树都在下面这一行的 `logs` 里 —— 已核对过这两处常量,不是假设。
        # 而且冒烟那一次启动根本不建任务,连目录都不会出现;这里删的是「万一」。
        rm -rf dist/terraforge/logs
        # MBTiles 导出(阶段 2 新增)同样不需要在这里加一条:导出落在**任务自己的
        # 输出目录**下(用户在表单里选的 output_path),不在 exe 旁边;而任务输出
        # 目录本身也不会出现在冒烟测试里 —— 那一次启动只请求了 `/` 与
        # `/tile-health`,没有创建任何任务。
        # base_z8 与 .base_unpack_* :Nuitka 排掉了解压后的 base_z8 却照样打进
        # 分卷,所以 is_base_ready 恒假,冒烟那一次启动会有后台线程开始解 4.3 万
        # 个文件,进程被 kill 时留下一棵解到一半的树 + 一个 pid 命名的临时目录。
        # 运行期没有任何路径会回收它们(见 base_terrain 的 UNPACK_TMP_PREFIX
        # 注释),不在这里删就会被 tar/7z 原样打进发布包。
        rm -rf dist/terraforge/assets/terrain/base_z8
        rm -rf dist/terraforge/assets/terrain/.base_unpack_*
        rm -f dist/terraforge/assets/terrain/.base_unpack.lock
        # 断言与删除逐项对齐:以后再多一类残留,漏删就会在这里红,而不是静默
        # 混进用户下载的包里。
        for leftover in data downloads cache logs smoke.log \
                        assets/terrain/base_z8 assets/terrain/.base_unpack.lock; do
          if [ -e "dist/terraforge/$leftover" ]; then
            echo "FAILED: dist/terraforge/$leftover still present after cleanup"
            exit 1
          fi
        done
        if compgen -G "dist/terraforge/assets/terrain/.base_unpack_*" > /dev/null; then
          echo "FAILED: base-terrain unpack temp dirs still present after cleanup"
          exit 1
        fi
        echo "Runtime data stripped; dist is clean for packaging"

    - name: Package application (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ${{ matrix.asset_name }} terraforge/

    - name: Package application (Windows)
      if: runner.os == 'Windows'
      run: |
        cd dist
        # 7z is preinstalled on windows-latest and works from bash without
        # PowerShell quoting headaches.
        7z a -tzip ${{ matrix.asset_name }} terraforge/

    # SHA-256 清单(§8.2「TerraForge 当前应做的」第二项,
    # 见 docs/notes/external-projects-takeaways.md)。
    #
    # 为什么这一项值得单列:§13-6 已决暂不做代码签名与自动更新,于是 Release 页面
    # 上那个包**没有任何来源自证**。用户从镜像站、网盘转载、公司内网仓库拿到一份
    # terraforge-windows.zip 时,除了「文件名一样」之外没有第二个判据。一份与包
    # 同时生成、挂在同一个 Release 上的哈希清单是这里最便宜的一道:它挡不住能改
    # Release 的攻击者(那需要签名),但挡得住转载途中的截断、错版本与替换 ——
    # 而那三种才是本项目实际会遇到的。同时它也让「用户报的问题出自哪一份包」
    # 从猜变成可对账。
    #
    # 两套命令:macOS runner 没有 coreutils 的 sha256sum,只有 shasum;
    # Linux 与 windows-latest 的 git-bash 都有 sha256sum。两者的输出格式
    # (`<hash>  <name>`)相同,所以清单文件在三平台上可以互相校验。
    # 写完立刻 -c 校验一次:清单本身写错(空文件、路径带 dist/ 前缀)时,
    # 用户拿到的是一份永远对不上的哈希,比没有清单更糟。
    - name: Generate SHA-256 manifest
      run: |
        cd dist
        ASSET="${{ matrix.asset_name }}"
        MANIFEST="$ASSET.sha256"
        if command -v sha256sum > /dev/null 2>&1; then
          sha256sum "$ASSET" > "$MANIFEST"
          sha256sum -c "$MANIFEST"
        else
          shasum -a 256 "$ASSET" > "$MANIFEST"
          shasum -a 256 -c "$MANIFEST"
        fi
        cat "$MANIFEST"

    - name: Upload artifact
      # Skip artifact upload on tag pushes — the Release step below already
      # attaches the same file, and artifacts double-count against the account-
      # level 500 MB Actions storage quota (the v0.0.1 build hit this).
      # 手动 dispatch 也默认不传:三个平台的包加起来约 450MB,一跑就顶满配额,
      # 而 dispatch 最常见的用途是给 master 预热编译缓存(见文件顶部注释),
      # 并不需要产物。要产物时在 dispatch 表单里把 upload_artifacts 勾上。
      if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.upload_artifacts }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        # 清单与包一起走:分开就会有人只拿到其中一个,而单独一份哈希文件没有用。
        path: |
          dist/${{ matrix.asset_name }}
          dist/${{ matrix.asset_name }}.sha256
        # Short retention so manual-dispatch / branch builds don't accumulate.
        retention-days: 7

    # ⚠ 残留风险:这一步跑在【每个 matrix job 内部】,Release 是被三个平台先后
    # 追加文件「长出来」的 —— 最先跑完的那个平台一提交,Release 就已经是
    # published 状态,而另外两个还在编译。上面的 fail-fast: false 保证失败的平台
    # 不会连带取消其余两个(补跑那一个 job 即可把产物补齐),但「Release 短暂只挂
    # 着一两份产物」这个窗口仍然存在。根治的做法是把发布挪到 needs: build 的汇总
    # job:三个平台只上传 artifact,汇总 job 下载齐了再一次性发布。那要改产物传递
    # 方式并重跑一整轮三平台验证,发版在即,本轮不做。
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      # 钉到 commit SHA(v2.6.2)而不是 v1 这种可变 tag:tag 能被上游重新指向,
      # 而这一步拿着 GITHUB_TOKEN 的 contents:write。
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        files: |
          dist/${{ matrix.asset_name }}
          dist/${{ matrix.asset_name }}.sha256
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
