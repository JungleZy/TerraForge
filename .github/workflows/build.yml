name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: terraforge-linux
            asset_name: terraforge-linux.tar.gz
          - os: windows-latest
            artifact_name: terraforge-windows
            asset_name: terraforge-windows.zip
          - os: macos-latest
            artifact_name: terraforge-macos
            asset_name: terraforge-macos.tar.gz

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Windows and macOS both install GDAL via conda-forge (see GDAL step
        # for the why). A login shell ensures the conda env activated by
        # setup-miniconda is on PATH for every subsequent step. bash -l works
        # on all three runners (Linux is unaffected — it uses system apt GDAL).
        shell: bash -l {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python (Linux)
      if: runner.os == 'Linux'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Miniconda (Windows/macOS)
      if: runner.os != 'Linux'
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        python-version: '3.12'
        activate-environment: build
        channels: conda-forge
        channel-priority: strict

    - name: Install GDAL (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev patchelf
        echo "GDAL_VERSION=$(gdal-config --version)" >> $GITHUB_ENV

    - name: Install GDAL (Windows/macOS, conda-forge)
      if: runner.os != 'Linux'
      run: |
        # Why conda-forge instead of brew/choco:
        #  - Windows: choco gdal package is dead.
        #  - macOS: macos-latest is Apple Silicon (arm64). brew ships arm64-only
        #    gdal, but pip's GDAL sdist tries to build a universal2 wheel and
        #    fails to link against the arm64-only libgdal. conda-forge ships a
        #    matching arm64 prebuilt + Python binding, no pip compile needed.
        conda install -y -c conda-forge gdal=3.8 numpy
        GDAL_VERSION=$(python -c "from osgeo import gdal; print(gdal.__version__)")
        echo "GDAL_VERSION=$GDAL_VERSION" >> $GITHUB_ENV
        # conda's gdal sets GDAL_DATA via activate scripts; surface it here so
        # nuitka_build.py can pick it up in a fresh sub-shell.
        GDAL_DATA=$(python -c "from osgeo import gdal; print(gdal.GetConfigOption('GDAL_DATA') or '')")
        echo "GDAL_DATA=$GDAL_DATA" >> $GITHUB_ENV

    - name: Install Python dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        # GDAL sdist 编译时必须能 import numpy，否则编不出 _gdal_array：
        # 先装 numpy，再关闭 build isolation 编译 GDAL。
        pip install numpy==1.26.4
        pip install --no-build-isolation GDAL==3.8.4
        pip install -r requirements.txt

    - name: Install Python dependencies (Windows/macOS)
      if: runner.os != 'Linux'
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        # GDAL already comes from conda; pip-installing it again would try to
        # build from sdist and fail. Strip the GDAL pin and install the rest.
        grep -viE '^[[:space:]]*gdal([[:space:]=<>!~]|$)' requirements.txt > /tmp/req.txt
        pip install -r /tmp/req.txt

    # C7: 先跑完整测试套件再打包——测试失败则构建失败。
    # 三个平台均已装好 GDAL（Linux=apt、Windows/macOS=conda-forge），
    # 测试为离线单元测试，无显示/无网络环境下全部可运行。
    - name: Run test suite
      run: python -m pytest tests/ -q

    - name: Build with Nuitka
      run: python nuitka_build.py

    # 冒烟测试:真正启动 exe 并请求首页。构建成功 ≠ 能运行——GDAL DLL 搜索
    # 路径、conda SWIG shim 的 pkg_resources 路径、multiprocessing spawn 等
    # 运行时问题只有跑了才暴露(v0.1.1 三次踩坑)。
    - name: Smoke test executable
      run: |
        cd dist/terraforge
        EXE=./terraforge
        [ "${{ runner.os }}" = "Windows" ] && EXE=./terraforge.exe
        "$EXE" > smoke.log 2>&1 &
        SMOKE_PID=$!
        code=000
        for i in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || true)
          [ "$code" = "200" ] && break
          sleep 2
        done
        kill $SMOKE_PID 2>/dev/null || true
        tail -30 smoke.log
        if [ "$code" != "200" ]; then
          echo "Smoke test FAILED (HTTP $code)"
          exit 1
        fi
        echo "Smoke test OK (HTTP 200)"

    - name: Package application (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ${{ matrix.asset_name }} terraforge/

    - name: Package application (Windows)
      if: runner.os == 'Windows'
      run: |
        cd dist
        # 7z is preinstalled on windows-latest and works from bash without
        # PowerShell quoting headaches.
        7z a -tzip ${{ matrix.asset_name }} terraforge/

    - name: Upload artifact
      # Skip artifact upload on tag pushes — the Release step below already
      # attaches the same file, and artifacts double-count against the account-
      # level 500 MB Actions storage quota (the v0.0.1 build hit this).
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.asset_name }}
        # Short retention so manual-dispatch / branch builds don't accumulate.
        retention-days: 7

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/${{ matrix.asset_name }}
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
