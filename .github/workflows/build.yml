name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: map-downloader-linux
            asset_name: map-downloader-linux.tar.gz
          - os: windows-latest
            artifact_name: map-downloader-windows
            asset_name: map-downloader-windows.zip
          - os: macos-latest
            artifact_name: map-downloader-macos
            asset_name: map-downloader-macos.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install GDAL (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev
        export GDAL_VERSION=$(gdal-config --version)
        echo "GDAL_VERSION=$GDAL_VERSION" >> $GITHUB_ENV

    - name: Install GDAL (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gdal
        export GDAL_VERSION=$(gdal-config --version)
        echo "GDAL_VERSION=$GDAL_VERSION" >> $GITHUB_ENV

    - name: Install GDAL (Windows)
      if: runner.os == 'Windows'
      run: |
        $ErrorActionPreference = "Continue"
        choco install gdal -y
        $env:GDAL_VERSION = "3.8.4"
        echo "GDAL_VERSION=$env:GDAL_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Set GDAL environment (Windows)
      if: runner.os == 'Windows'
      run: |
        $gdalPath = "C:\Program Files\GDAL"
        if (Test-Path $gdalPath) {
          echo "$gdalPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:GDAL_DATA = "$gdalPath\gdal-data"
          echo "GDAL_DATA=$env:GDAL_DATA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build with PyInstaller (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller build.spec

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller build.spec

    - name: Package application (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        tar -czf ${{ matrix.asset_name }} map-downloader/
        cd ..

    - name: Package application (Windows)
      if: runner.os == 'Windows'
      run: |
        cd dist
        Compress-Archive -Path map-downloader/* -DestinationPath ${{ matrix.asset_name }}
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.asset_name }}

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
