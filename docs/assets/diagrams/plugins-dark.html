<h1>插件系统的四个扩展点</h1>
<p class="sub">插件声明自己是什么（<code>plugin.toml</code>），过三道闸（API 主版本、ABI 标签、方法签名）才进注册表；能力查询是唯一入口，运行期只有一个 <code>TaskContext</code> 门面。</p>
