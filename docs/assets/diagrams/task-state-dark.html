<p class="eyebrow">STATE MACHINE · TERRAFORGE</p>
<h1>任务状态机与缺块语义</h1>
<p class="sub">八个状态四条管线共用（<code>TaskState</code>，值即落库文本）。只有 no_data 这一类缺块会自动完成；出现任何一块真失败就停在「待决策」等用户拍板。补漏可以从待决策、带缺块完成与失败三处发起。</p>
