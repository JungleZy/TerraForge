<h1>TerraForge 四条数据管线</h1>
<p class="sub">四条管线各有自己的管理器、数据库表与产物目录，只共享调度器与配置；唯一的跨管线交接是「DEM 任务的高程文件被地形 / 等高线管线零拷贝复用」。</p>
