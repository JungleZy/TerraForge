<p class="eyebrow">ARCHITECTURE · TERRAFORGE</p>
<h1>TerraForge 系统架构</h1>
<p class="sub">浏览器分三路进来：主端口要页面与 REST、瓦片端口取瓦片、底图转发换同源底图。写任务的四条管线加插件宿主都得先向全局调度器要配额，拿到多少就开多大的池子。</p>
