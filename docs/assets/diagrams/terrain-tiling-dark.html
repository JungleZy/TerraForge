<h1>地形切片流水线</h1>
<p class="sub">从一堆 DEM 文件到可直接拷走的 quantized-mesh 目录。两处反直觉：多幅输入必须先物化成单幅 GeoTIFF 才能采样；全球底座是切片<b>之后</b>才植入，切片前反而要先摘掉上一轮的硬链接。</p>
