{% extends "base.html" %}

{% block title %}历史记录 - TerraForge{% endblock %}

{% block content %}
<div class="page-content">
<a class="back-home-link" href="/">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
        <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    返回首页
</a>
{% include "_history_content.html" %}
</div>

<!-- 任务详情模态框（body 顶层，见 index.html 同位注释） -->
<div class="modal fade" id="taskDetailModal" tabindex="-1" aria-labelledby="taskDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taskDetailModalLabel">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    任务详情
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="detail-grid">
                  <div class="detail-item"><span class="detail-k">任务ID</span><span class="detail-v" id="detailId"></span></div>
                  <div class="detail-item"><span class="detail-k">任务名称</span><span class="detail-v" id="detailName"></span></div>
                  <div class="detail-item"><span class="detail-k">状态</span><span class="detail-v" id="detailStatus"></span></div>
                  <div class="detail-item"><span class="detail-k">地图样式</span><span class="detail-v" id="detailStyle"></span></div>
                  <div class="detail-item"><span class="detail-k">输出格式</span><span class="detail-v" id="detailFormat"></span></div>
                  <div class="detail-item"><span class="detail-k">缩放级别</span><span class="detail-v" id="detailZoom"></span></div>
                  <div class="detail-item"><span class="detail-k">总数量</span><span class="detail-v" id="detailTotal"></span></div>
                  <div class="detail-item"><span class="detail-k">已下载</span><span class="detail-v" id="detailDownloaded"></span></div>
                  <div class="detail-item"><span class="detail-k">失败</span><span class="detail-v" id="detailFailed"></span></div>
                </div>
                <div style="margin-top:1rem;"><span class="detail-k">进度</span> <span id="detailProgress"></span></div>
                <hr style="border-color: var(--color-border);">
                <div class="row">
                    <div class="col-12">
                        <p class="detail-k" style="margin-bottom: 0.5rem;">区域范围</p>
                        <div class="detail-grid">
                            <div class="detail-item"><span class="detail-k">北纬</span><span class="detail-v" style="font-family: var(--font-mono);" id="detailNorth"></span></div>
                            <div class="detail-item"><span class="detail-k">南纬</span><span class="detail-v" style="font-family: var(--font-mono);" id="detailSouth"></span></div>
                            <div class="detail-item"><span class="detail-k">东经</span><span class="detail-v" style="font-family: var(--font-mono);" id="detailEast"></span></div>
                            <div class="detail-item"><span class="detail-k">西经</span><span class="detail-v" style="font-family: var(--font-mono);" id="detailWest"></span></div>
                        </div>
                    </div>
                </div>
                <hr style="border-color: var(--color-border);">
                <div class="row">
                    <div class="col-12">
                        <div class="detail-item"><span class="detail-k">输出路径</span><span class="detail-v"><code id="detailPath"></code></span></div>
                        <div class="detail-grid" style="margin-top: 0.5rem;">
                            <div class="detail-item"><span class="detail-k">创建时间</span><span class="detail-v" id="detailCreated"></span></div>
                            <div class="detail-item"><span class="detail-k">开始时间</span><span class="detail-v" id="detailStarted"></span></div>
                            <div class="detail-item"><span class="detail-k">完成时间</span><span class="detail-v" id="detailCompleted"></span></div>
                        </div>
                    </div>
                </div>
                <div class="row" id="detailErrorRow" style="display: none;">
                    <div class="col-12">
                        <hr style="border-color: var(--color-border);">
                        <p><strong>错误信息:</strong></p>
                        <div class="alert alert-danger" id="detailError"></div>
                    </div>
                </div>

                <div class="row" id="detailTerrainRow" style="display: none;">
                    <div class="col-12">
                        <hr style="border-color: var(--color-border);">
                        <div class="d-flex justify-content-between align-items-start" style="gap: 1rem;">
                            <div>
                                <p style="margin-bottom: 0.25rem;"><strong>地形切片:</strong> <span id="detailTerrainStatus"></span></p>
                                <div id="detailTerrainInfo" style="font-family: var(--font-mono); font-size: 0.9rem;"></div>
                            </div>
                            <div class="btn-group btn-group-sm" style="flex: 0 0 auto;">
                                <button type="button" class="btn btn-primary" id="detailTerrainStartBtn" title="启动地形切片">启动</button>
                                <button type="button" class="btn btn-outline-secondary" id="detailTerrainRefreshBtn" title="刷新切片状态">刷新</button>
                            </div>
                        </div>
                        <div class="row" id="detailTerrainErrorRow" style="display: none; margin-top: 0.75rem;">
                            <div class="col-12">
                                <div class="alert alert-danger" id="detailTerrainError" style="margin: 0;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
<script>
    initHistory();
</script>
{% endblock %}
