{% extends "base.html" %}

{% block title %}地图下载 - Maps Downloader{% endblock %}

{% block content %}
<div class="index-layout">
    <!-- Left side: Map -->
    <div class="index-left">
        <div class="card">
            <div class="card-header">
                <h5>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                        <line x1="8" y1="2" x2="8" y2="18"></line>
                        <line x1="16" y1="6" x2="16" y2="22"></line>
                    </svg>
                    选择下载区域
                </h5>
            </div>
            <div class="card-body p-0">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Right side: Parameters and Tasks (scrollable) -->
    <div class="index-right">
        <div class="card">
            <div class="card-header">
                <h5>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                    </svg>
                    下载参数
                </h5>
            </div>
            <div class="card-body">
                <form id="downloadForm">
                    <div class="form-group-label">基础</div>
                    <div class="mb-3">
                        <label for="taskName" class="form-label">任务名称</label>
                        <input type="text" class="form-control" id="taskName" placeholder="输入任务名称..." required>
                    </div>

                    <div class="mb-3">
                        <label for="downloadType" class="form-label">下载类型</label>
                        <select class="form-select" id="downloadType">
                            <option value="map">地图瓦片</option>
                            <option value="dem">GDEM V3 30m (ASTER GDEM V3)</option>
                            <option value="local_terrain">本地高程切片（上传 GeoTIFF）</option>
                            <option value="contour">等高线瓦片</option>
                        </select>
                    </div>

                    <div class="form-group-label">范围与层级</div>
                    <div class="mb-3" id="mapStyleField">
                        <label for="mapStyle" class="form-label">地图样式</label>
                        <select class="form-select" id="mapStyle">
                            <option value="m">标准地图</option>
                            <option value="s">卫星图</option>
                            <option value="y">卫星图+标注</option>
                            <option value="h">道路图</option>
                            <option value="t">地形图</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="zoomMin" class="form-label">最小缩放级别</label>
                            <input type="number" class="form-control" id="zoomMin" min="0" max="21" value="10">
                        </div>
                        <div class="col-6 mb-3">
                            <label for="zoomMax" class="form-label">最大缩放级别</label>
                            <input type="number" class="form-control" id="zoomMax" min="0" max="21" value="15">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="outputFormat" class="form-label">输出格式</label>
                        <select class="form-select" id="outputFormat">
                            <option value="both">瓦片+拼接图</option>
                            <option value="tiles_only">仅瓦片</option>
                            <option value="image_only">仅拼接图</option>
                        </select>
                    </div>

                    <div class="mb-3" id="demOptions" style="display:none;">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="demDownloadNum">
                            <label class="form-check-label" for="demDownloadNum">同时下载 NUM 质量文件</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="demDownloadSwb">
                            <label class="form-check-label" for="demDownloadSwb">同时下载 SWB 水体掩膜文件</label>
                        </div>
                    </div>

                    <div class="mb-3" id="localTerrainOptions" style="display:none;">
                        <label for="localTerrainFiles" class="form-label">上传高程文件（可多选 .tif/.tiff）</label>
                        <input type="file" class="form-control" id="localTerrainFiles" accept=".tif,.tiff" multiple>
                        <label for="localTerrainMaxzoom" class="form-label mt-2">最大切片层级</label>
                        <input type="number" class="form-control" id="localTerrainMaxzoom" min="0" max="21" value="14">
                    </div>

                    <div class="mb-3" id="contourOptions" style="display:none;">
                        <label for="contourInterval" class="form-label">基准等高距（米）</label>
                        <input type="number" class="form-control" id="contourInterval" min="1" step="1" value="50">
                        <small class="form-text text-muted">基准（最细）等高距；低层级会自动变粗以免线条拥挤。小范围 50m、大范围 100m。</small>

                        <label class="form-label mt-2">背景</label>
                        <div class="d-flex align-items-center gap-2">
                            <input type="color" id="contourBackground" value="#faf6ec" class="form-control form-control-color" style="max-width:60px;">
                            <div class="form-check mb-0">
                                <input type="checkbox" id="contourBackgroundTransparent" class="form-check-input">
                                <label class="form-check-label" for="contourBackgroundTransparent">透明（叠加到底图用）</label>
                            </div>
                        </div>
                        <small class="form-text text-muted">默认米白；勾选透明可把等高线叠加到卫星/标准底图上。</small>
                    </div>

                    <div class="form-group-label">输出</div>
                    <div class="mb-3">
                        <label for="outputPath" class="form-label">保存路径</label>
                        <input type="text" class="form-control" id="outputPath" value="./downloads/map" placeholder="输入保存路径...">
                    </div>

                    <div class="alert alert-info" id="boundsInfo">
                        <small>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="16" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12.01" y2="8"></line>
                            </svg>
                            请在地图上框选下载区域
                        </small>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" id="createTaskBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        创建下载任务
                    </button>
                </form>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header">
                <h5>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    活动任务
                </h5>
            </div>
            <div class="card-body" id="activeTasks">
                <p class="text-muted">暂无活动任务</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
<script>
    const config = {{ config|tojson }};
    initMap(config);
    initDownloadTypeToggle();
    initTasks();
    initContourPreview();
</script>
{% endblock %}
